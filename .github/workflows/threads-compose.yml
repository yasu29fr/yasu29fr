name: Threads 翌日ぶんを作成

# 運用ボードとネタ帳を材料に、翌日ぶんの投稿 3 本を作ってキューに追加する。
# 外部 cron から毎日 20:00 (JST) に threads-compose で起動する想定。
# （20:00 は投稿時刻でもあるが、threads-post と同じ concurrency group なので直列化される）
on:
  repository_dispatch:
    types: [threads-compose]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら生成結果を表示するだけでキューに書き込まない"
        required: false
        default: "false"
      target_date:
        description: "作成対象日 YYYY-MM-DD（空なら翌日）"
        required: false
        default: ""

# 投稿の実行と重ならないよう、同じ枠で直列化する
concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      # 外部 cron からは client_payload.target_date で当日ぶんの作り直しができる
      TARGET_DATE: ${{ github.event.client_payload.target_date || github.event.inputs.target_date }}
      # ONLY_HOURS=15 のように渡すと、その枠だけを作る
      ONLY_HOURS: ${{ github.event.client_payload.only_hours }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # ドキュメント ID は秘密ではないので Variables に置く
      BOARD_DOC_ID: ${{ vars.BOARD_DOC_ID }}
      NETA_DOC_ID: ${{ vars.NETA_DOC_ID }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 翌日ぶんの 3 本を作る
        run: python scripts/compose.py

      # 楽天トラベルの40%OFF以上のクーポンがあれば、明日の 19:00 に1本だけ紹介を足す
      # （クーポンは x-yu__fukui-bot が週1回集める。2026-09-30 代表指示）
      - name: 大きいクーポンの紹介を足す
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COUPON_HOUR: "19"
          COUPON_STYLE: "yu"
          GITHUB_TOKEN: ${{ github.token }}
        run: python "scripts/クーポンの投稿.py"

      - name: キューの形式を検証する
        env:
          PYTHONPATH: src
        run: python -m threads_bot validate

      - name: キューをコミットする
        run: |
          ./scripts/commit_file.sh posts/queue.jsonl "chore(queue): 翌日ぶんの 3 本を追加"
