name: Threads 自動投稿

on:
  # UTC で書く。0 0 * * * = 日本時間 毎日 9:00
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "この実行で投稿する件数"
        required: false
        default: "1"
      dry_run:
        description: "true なら API を呼ばず内容だけ表示する"
        required: false
        default: "false"

# 前の実行が終わる前に次が走ると二重投稿になりうるので直列化する
concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      # 投稿済み記録 (state/posted.json) をコミットして戻すため
      contents: write
    env:
      PYTHONPATH: src
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      LIMIT: ${{ github.event.inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: キューの形式を検証する
        run: python -m threads_bot validate

      - name: 投稿する
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          args="post --limit ${LIMIT:-1}"
          if [ "${DRY_RUN}" = "true" ]; then
            args="$args --dry-run"
          fi
          python -m threads_bot $args

      - name: 投稿済み記録をコミットする
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry-run のためコミットしません。"
            exit 0
          fi
          if git diff --quiet -- state/posted.json; then
            echo "記録に変更なし。コミットはしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git commit -m "chore: 投稿済み記録を更新"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            wait=$((2 ** attempt))
            echo "push に失敗。${wait} 秒待って再試行します。"
            sleep "${wait}"
          done
          exit 1
